  --c-pastel:#D1DDE6; --c-sand-60:#E6E0C5; --c-clay-60:#E9DED3; --c-muted-blue:#7BAFD4; --c-mid-blue:#336893;

[hidden]{display:none!important}

.vh{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* Icons: Material Symbols Rounded, the design's icon family */
.ms{font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; font-size:24px; width:1em; height:1em; line-height:1; display:inline-block; flex:none; overflow:hidden; text-align:center;
  letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; font-feature-settings:"liga"; -webkit-font-smoothing:antialiased; user-select:none;
  --fill:0; --opsz:24; font-variation-settings:"FILL" var(--fill), "wght" 400, "GRAD" 0, "opsz" var(--opsz)}
.ms.s16{font-size:16px; --opsz:20} .ms.s20{font-size:20px; --opsz:20} .ms.s40{font-size:40px; --opsz:40}
.ms.f{--fill:1}
html:not(.ms-ready) .ms{color:transparent!important}
.well{display:grid; place-items:center; flex:none; background:var(--c-tint); color:var(--c-blue); width:40px; height:40px; border-radius:var(--r-8)}
.well-48{width:48px; height:48px; border-radius:var(--r-12)}

/* Device screen (the bezel is drawn by the Admin) */
.screen{position:relative; width:390px; height:844px; overflow:hidden; border-radius:44px; background:var(--c-bg); color:var(--c-text); font-family:var(--font); font-size:var(--fs-16); line-height:var(--lh-16);
  display:flex; flex-direction:column; isolation:isolate; font-optical-sizing:auto; -webkit-font-smoothing:antialiased}
.screen button{cursor:pointer}
.statusbar{height:var(--status-h); background:var(--c-blue); color:var(--c-on-blue); display:flex; align-items:center; justify-content:space-between; padding-inline:var(--sp-32); font-size:var(--fs-14); font-weight:600; flex:none}
.statusbar .sys{display:flex; gap:var(--sp-4); align-items:center}
.statusbar .sys i{display:block; width:16px; height:12px; border-radius:2px; background:currentColor}
.statusbar .sys i:nth-child(2){width:24px; border-radius:4px; background:none; border:2px solid currentColor}
.screen.st-dark .statusbar{background:transparent; position:absolute; inset:0 0 auto; z-index:30}
/* Lock screen (push notification preview): only the OS lock screen, no app chrome underneath */
.screen.st-dark :is(.appbar,.views,.tabbar){display:none}
.screen.st-dark .lock{z-index:20}
.appbar{background:var(--c-blue); color:var(--c-on-blue); display:flex; align-items:center; gap:var(--sp-4); padding-inline:var(--sp-8); height:64px; flex:none; position:relative; z-index:3}
.appbar .ttl{flex:1; min-width:0; font-size:var(--fs-20); line-height:var(--lh-20); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:var(--sp-8)}
.appbar.home{padding-inline:var(--sp-16) var(--sp-12); gap:var(--sp-8)}
.appbar .logo{display:block; width:188px; height:auto; flex:none}
.appbar .sp{flex:1}
.ab-sign{height:44px; flex:none; display:inline-flex; align-items:center; gap:var(--sp-8); padding:0 var(--sp-16) 0 var(--sp-12); border:0; border-radius:var(--r-full); background:var(--c-on-blue-tonal); color:var(--c-on-blue); font-size:var(--fs-14); font-weight:600}
.icon-btn{width:44px; height:44px; border-radius:var(--r-full); border:0; background:transparent; display:grid; place-items:center; position:relative; color:inherit; flex:none}
.appbar .ab-menu{background:var(--c-on-blue-tonal)}
.ab-dot{position:absolute; top:6px; right:6px; width:10px; height:10px; border-radius:var(--r-full); background:var(--c-cyan); box-shadow:0 0 0 2px var(--c-blue)}
.views{flex:1; position:relative; min-height:0; overflow:hidden}
.view{position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; background:var(--c-bg)}
.view::-webkit-scrollbar{display:none}
.view::after{content:""; display:block; height:calc(var(--tabbar-h) - var(--sp-24))}
.view:focus-visible{outline:none; box-shadow:inset 0 0 0 3px #FFFFFF, inset 0 0 0 6px var(--c-blue)}
.v-inner{display:flex; flex-direction:column; gap:var(--sp-24); padding-bottom:var(--sp-48)}
.res-body{display:flex; flex-direction:column; gap:var(--sp-16); padding:var(--sp-16)}

/* Shared components */
.btn{min-height:48px; padding-inline:var(--sp-16); border-radius:var(--r-12); border:0; font-size:var(--fs-16); line-height:var(--lh-16); font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-8); text-align:center}
.btn-primary{background:var(--c-blue); color:var(--c-on-blue)}
.btn-ghost{background:transparent; color:var(--c-blue); padding-inline:var(--sp-8)}
.btn-white{background:var(--c-surface); color:var(--c-blue)}
.btn-sm{min-height:44px; font-size:var(--fs-14); line-height:var(--lh-14); padding-inline:var(--sp-12)}
.card{background:var(--c-surface); border-radius:var(--r-16); box-shadow:0 1px 2px rgba(0,30,60,.06),0 0 0 1px var(--c-border)}
.eyebrow{font-size:var(--fs-12); line-height:var(--lh-12); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c-text-2)}
.sec-h{font-size:var(--fs-18); line-height:var(--lh-18); font-weight:700; color:var(--c-blue); text-wrap:balance}
.lbl-h{font-size:var(--fs-14); line-height:var(--lh-14); font-weight:700; color:var(--c-text-2); letter-spacing:.06em; text-transform:uppercase}
.mod-head{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-8)}
.mod-head .btn{margin-block:calc(var(--sp-12) * -1); margin-inline-end:calc(var(--sp-12) * -1)}
.fine{font-size:var(--fs-14); line-height:var(--lh-14); color:var(--c-text-2)}
.grp{display:flex; flex-direction:column; gap:var(--sp-8)}
.chips{display:flex; flex-wrap:wrap; gap:var(--sp-8)}
.chip{min-height:44px; padding-inline:var(--sp-16); border-radius:var(--r-full); border:1px solid var(--c-border-strong); background:var(--c-surface); color:var(--c-text); font-size:var(--fs-14); line-height:var(--lh-14); font-weight:600; display:inline-flex; align-items:center; gap:var(--sp-8); text-align:left}
.chip .ms{color:var(--c-blue)}
.chip.on-blue-chip{background:var(--c-on-blue-fill); border-color:var(--c-on-blue-line); color:var(--c-on-blue)}
.chip.on-blue-chip .ms{color:var(--c-on-blue)}
.list{display:flex; flex-direction:column; overflow:hidden}
.row{display:flex; align-items:center; gap:var(--sp-12); padding:var(--sp-12) var(--sp-16); min-height:56px; border:0; background:transparent; text-align:left; width:100%; color:var(--c-text)}
.row + .row{box-shadow:0 -1px 0 var(--c-border)}
.row .rt{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--sp-4)}
.row .rt b{font-weight:600; font-size:var(--fs-16); line-height:var(--lh-16)}
.row .rt span{font-size:var(--fs-14); line-height:var(--lh-14); color:var(--c-text-2)}
.row > .ms{color:var(--c-text-2)}
.row.off{opacity:.45}
.row.off .rt b::after{content:" (hidden)"; font-weight:400}
.new-pill{font-size:var(--fs-12); line-height:var(--lh-12); font-weight:700; color:var(--c-on-blue); background:var(--c-blue); border-radius:var(--r-full); padding:var(--sp-4) var(--sp-8); align-self:flex-start; flex:none}
.notice{display:flex; gap:var(--sp-8); align-items:flex-start; background:var(--c-tint); border-radius:var(--r-12); padding:var(--sp-12); font-size:var(--fs-14); line-height:var(--lh-14)}
.notice .ms{color:var(--c-blue)}
.avatar{border-radius:50%; flex:none; display:grid; place-items:center; font-weight:700; color:var(--c-blue); background:var(--c-tint); width:40px; height:40px; font-size:var(--fs-14)}
.avatar.a1{background:var(--c-pastel)} .avatar.a2{background:var(--c-sand-60)}
.pv-empty{margin:0; padding:var(--sp-24) var(--sp-16); border-radius:var(--r-16); border:1.5px dashed var(--c-border-strong); color:var(--c-text-2); font-size:var(--fs-14); line-height:var(--lh-14); text-align:center}
.pv-hl{box-shadow:0 0 0 3px var(--c-cyan)!important; position:relative}
.pv-hl::before{content:"Editing"; position:absolute; z-index:2; top:var(--sp-8); left:var(--sp-8); padding:2px var(--sp-8); border-radius:var(--r-full); background:var(--c-cyan); color:#00243F; font-size:var(--fs-12); line-height:var(--lh-12); font-weight:700}
.tile.pv-hl::before{top:-10px; left:auto; right:var(--sp-8)}

/* Home: alerts above the Find Care hero, both on Blue */
.top{display:flex; flex-direction:column}
.hero{background:var(--c-blue); color:var(--c-on-blue); padding:var(--sp-8) var(--sp-16) var(--sp-24); display:flex; flex-direction:column; gap:var(--sp-16); border-radius:0 0 var(--r-24) var(--r-24); position:relative; overflow:hidden; isolation:isolate}
.hero > *{position:relative; z-index:1}
.hero .aurora{position:absolute; inset:0; z-index:0; pointer-events:none; -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 112px); mask-image:linear-gradient(to bottom,transparent 0,#000 112px)}
.hero .aurora i{position:absolute; inset:-40%; display:block; background:radial-gradient(30% 34% at 80% 54%,rgba(0,169,224,.36),transparent 70%),radial-gradient(28% 30% at 18% 84%,rgba(123,175,212,.2),transparent 72%),radial-gradient(22% 24% at 50% 62%,rgba(0,169,224,.1),transparent 70%)}
.fc-kick{display:inline-flex; align-items:center; gap:var(--sp-8); font-size:var(--fs-20); line-height:var(--lh-20); font-weight:700; color:#FFFFFF; margin-bottom:var(--sp-4)}
.fc-kick .ms{color:var(--c-cyan)}
.hero .sub{color:var(--c-on-blue); font-weight:500}
.hero .top-s{display:flex; flex-direction:column; gap:var(--sp-8)}
.hero .top-s .eyebrow{color:var(--c-on-blue-2)}
.search-entry{display:flex; align-items:center; gap:var(--sp-12); min-height:56px; padding-inline:var(--sp-16); border-radius:var(--r-full); border:0; background:var(--c-surface); color:var(--c-text-2); text-align:left; box-shadow:0 2px 8px rgba(0,20,40,.2); width:100%}
.search-entry .ms{color:var(--c-blue)}
.search-entry > span:not(.ms){flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.alerts{display:flex; flex-direction:column; gap:var(--sp-12); padding:var(--sp-12) var(--sp-16) 0; background:var(--c-blue)}
.alerts + .hero{padding-top:var(--sp-16)}
.alert{border-radius:var(--r-16); position:relative; color:var(--c-text)}
.alert h2{font-size:inherit; line-height:inherit; font-weight:inherit}
.alert-toggle{display:flex; width:100%; gap:var(--sp-12); align-items:center; text-align:left; background:transparent; border:0; padding:var(--sp-12) var(--sp-12) var(--sp-12) var(--sp-16); min-height:56px; border-radius:var(--r-16); color:inherit}
.alert .sev-ic{width:40px; height:40px; flex:none; border-radius:50%; display:grid; place-items:center}
.alert-txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--sp-4)}
.alert-meta{font-size:var(--fs-12); line-height:var(--lh-12); color:var(--c-text-2)}
.alert-meta b{font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.alert-title{font-size:var(--fs-16); line-height:var(--lh-16); font-weight:700}
.alert .chev{transition:transform var(--dur-base) var(--ease-std)}
.alert.open .chev{transform:rotate(180deg)}
.alert-body{padding:0 var(--sp-16) var(--sp-16); display:flex; flex-direction:column; gap:var(--sp-12)}
.alert-body p{font-size:var(--fs-14); line-height:var(--lh-14)}
.alert-body .row-btns{display:flex; flex-wrap:wrap; gap:var(--sp-12)}
.alert.emergency{background:linear-gradient(150deg,#C8104A 0%,#B0003A 45%,#86002C 100%); color:#FFFFFF; box-shadow:0 6px 20px rgba(120,0,40,.32),inset 0 0 0 1px rgba(255,255,255,.14)}
.emergency .sev-ic{background:#FFFFFF; color:#B0003A}
.emergency .alert-meta{color:rgba(255,255,255,.88)}
.emergency .alert-meta b,.emergency .alert-title,.emergency .chev,.emergency .alert-body p{color:#FFFFFF}
.emergency .btn-primary{background:#FFFFFF; color:#B0003A}
.emergency .btn-ghost{color:#FFFFFF; background:rgba(255,255,255,.14)}
.alert.advisory{background:#FFFFFF; box-shadow:0 4px 16px rgba(0,20,40,.18)}
.advisory .sev-ic{background:var(--c-tint); color:var(--c-blue)}
.advisory .alert-meta b{color:var(--c-blue)}
.advisory .chev{color:var(--c-blue)}
.alert.stacked::after{content:""; position:absolute; left:var(--sp-12); right:var(--sp-12); bottom:calc(var(--sp-8) * -1); height:var(--sp-8); background:rgba(255,255,255,.55); border-radius:0 0 var(--r-12) var(--r-12)}
.more-alerts{align-self:flex-start; min-height:44px; border:0; background:transparent; color:var(--c-on-blue); font-size:var(--fs-14); font-weight:600; display:flex; gap:var(--sp-4); align-items:center; padding-inline:var(--sp-4); border-radius:var(--r-8)}

/* Modules */
.mod{padding-inline:var(--sp-16); display:flex; flex-direction:column; gap:var(--sp-12)}
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--sp-12)}
.tile{min-height:72px; border:0; background:var(--c-surface); border-radius:var(--r-16); box-shadow:0 0 0 1px var(--c-border); display:flex; align-items:center; gap:var(--sp-12); padding:var(--sp-12); text-align:left; font-size:var(--fs-14); line-height:var(--lh-14); font-weight:600; color:var(--c-text)}
.h-scroll{position:relative; display:flex; gap:var(--sp-12); overflow-x:auto; margin-inline:calc(var(--sp-16) * -1); padding-inline:var(--sp-16); padding-block:var(--sp-4); scrollbar-width:none}
.h-scroll::-webkit-scrollbar{display:none}
.mb-row{align-items:stretch}
.mb-item{flex:0 0 248px; display:flex}
.mb-card{width:100%; display:flex; flex-direction:column; border:0; padding:0; overflow:hidden; text-align:left; color:var(--c-text)}
.mb-art{position:relative; height:112px; overflow:hidden; display:block; color:#FFFFFF}
.mb-art .r1{position:absolute; right:-36px; top:-44px; width:136px; height:136px; border-radius:50%; border:18px solid rgba(255,255,255,.16)}
.mb-art .r2{position:absolute; right:56px; bottom:-30px; width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.1)}
.mb-ic{position:absolute; left:var(--sp-16); bottom:var(--sp-16); width:48px; height:48px; border-radius:var(--r-12); display:grid; place-items:center; background:rgba(255,255,255,.18); box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.mb-read{position:absolute; right:var(--sp-12); top:var(--sp-12); display:inline-flex; align-items:center; gap:var(--sp-4); padding:2px var(--sp-8) 2px 6px; border-radius:var(--r-full); background:rgba(255,255,255,.92); color:var(--c-text); font-size:var(--fs-12); line-height:var(--lh-12); font-weight:600}
.t-blue{background:linear-gradient(135deg,#336893,#004278)} .t-orange{background:linear-gradient(135deg,#E87722,#B5541A)} .t-clay{background:linear-gradient(135deg,#B86A61,#8A453E)}
.t-green{background:linear-gradient(135deg,#3E8E2A,#2C6E1B)} .t-purple{background:linear-gradient(135deg,#8246AF,#5F2F86)} .t-sky{background:linear-gradient(135deg,#4F8DBF,#2A6AA3)}
.mb-txt{flex:1; display:flex; flex-direction:column; gap:var(--sp-4); padding:var(--sp-12) var(--sp-16) var(--sp-16)}
.mb-cat{font-size:var(--fs-12); line-height:var(--lh-12); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--c-blue)}
.mb-t{font-size:var(--fs-16); line-height:var(--lh-16); font-weight:700; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:calc(var(--lh-16) * 3)}
.mb-d{margin-top:auto; padding-top:var(--sp-4); font-size:var(--fs-14); line-height:var(--lh-14); color:var(--c-text-2)}
.svc{flex:0 0 232px; padding:0; border:0; overflow:hidden; display:flex; flex-direction:column; text-align:left; color:var(--c-text); background:var(--c-surface)}
.svc-art{position:relative; height:112px; display:grid; place-items:center; background:var(--c-blue); overflow:hidden; color:#FFFFFF}
.svc-art.a1{background:linear-gradient(150deg,#336893,var(--c-blue))}
.svc-art.a2{background:linear-gradient(150deg,var(--c-blue),#002B50)}
.svc-art .s1{position:absolute; right:-28px; top:-36px; width:112px; height:112px; border-radius:50%; border:16px solid var(--c-cyan); opacity:.55}
.svc-art .s2{position:absolute; left:-20px; bottom:-28px; width:72px; height:72px; border-radius:50%; background:rgba(255,255,255,.1)}
.svc-art .ms{position:relative}
.svc-body{display:flex; flex-direction:column; gap:var(--sp-4); padding:var(--sp-12) var(--sp-16) var(--sp-16)}
.svc-cat{align-self:flex-start; font-size:var(--fs-12); line-height:var(--lh-12); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--c-blue); background:var(--c-tint); border-radius:var(--r-full); padding:2px var(--sp-8); margin-bottom:var(--sp-4)}
.svc-body b{font-size:var(--fs-16); line-height:var(--lh-16); font-weight:700}
.svc-body > span:last-child{font-size:var(--fs-14); line-height:var(--lh-14); color:var(--c-text-2)}
.mychart{position:relative; overflow:hidden; isolation:isolate; padding:var(--sp-16) var(--sp-16) var(--sp-24); display:flex; flex-direction:column; gap:var(--sp-16); border-radius:var(--r-16); color:var(--c-on-blue);
  background:linear-gradient(160deg,#0A4E86 0%,var(--c-blue) 45%,#00274A 100%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 8px 24px rgba(0,30,60,.16)}
.mychart .mc-glow{position:absolute; z-index:-1; inset:auto -30% -60% auto; width:90%; height:120%; background:radial-gradient(closest-side,rgba(0,169,224,.30),rgba(0,169,224,0)); pointer-events:none}
.mychart .mc-txt{display:flex; flex-direction:column; gap:var(--sp-4)}
.mychart .eyebrow{color:var(--c-on-blue-2)}
.mychart h2{font-size:var(--fs-20); line-height:var(--lh-20); font-weight:700; letter-spacing:-.01em}
.mychart p{color:var(--c-on-blue-2)}
.mc-btns{display:flex; flex-wrap:wrap; gap:var(--sp-12)}
.mc-b{height:48px; flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-8); padding-inline:var(--sp-24); border-radius:var(--r-full); border:0; font-size:var(--fs-16); font-weight:600}
.mc-solid{background:#FFFFFF; color:var(--c-blue); padding-left:var(--sp-16)}
.mc-line{background:rgba(255,255,255,.06); color:var(--c-on-blue); box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.ann-date{width:56px; flex:none; font-size:var(--fs-12); line-height:var(--lh-12); font-weight:700; color:var(--c-blue); letter-spacing:.04em; align-self:flex-start; padding-top:var(--sp-4)}
.ann .row{align-items:flex-start}
.campaign{color:var(--c-on-blue); border-radius:var(--r-16); display:flex; flex-direction:column; gap:var(--sp-16); position:relative; overflow:hidden; isolation:isolate;
  background:linear-gradient(140deg,#0A4E86 0%,var(--c-blue) 46%,#00264A 100%); box-shadow:0 10px 28px rgba(0,30,60,.22),inset 0 0 0 1px rgba(255,255,255,.14); padding:var(--sp-24) var(--sp-16) var(--sp-24) var(--sp-24)}
.campaign > .eyebrow + h2,.campaign > h2 + p{margin-top:calc(var(--sp-12) * -1)}
.campaign .eyebrow{color:#FFFFFF; padding-top:var(--sp-8)}
.campaign h2{font-size:var(--fs-24); line-height:var(--lh-24); font-weight:700; max-width:calc(100% - 76px); text-wrap:balance}
.campaign p{color:var(--c-on-blue-2)}
.cp-glow{position:absolute; z-index:-1; inset:-40%; background:radial-gradient(40% 40% at 70% 70%,rgba(0,169,224,.32),rgba(0,169,224,0) 70%),radial-gradient(35% 35% at 20% 10%,rgba(123,175,212,.22),rgba(123,175,212,0) 70%); pointer-events:none}
.cp-glass{position:absolute; inset:0; z-index:-1; pointer-events:none; border-radius:inherit; background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,0) 52%); box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.18)}
.cp-badge{position:absolute; top:var(--sp-16); right:var(--sp-16); width:76px; height:76px; display:grid; place-items:center}
.cp-ring{position:absolute; inset:0; border-radius:50%; border:2px dashed rgba(255,255,255,.38)}
.cp-core{position:relative; width:58px; height:58px; border-radius:50%; display:grid; place-items:center; color:#FFFFFF; background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),rgba(255,255,255,.10)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.34),0 6px 18px rgba(0,20,40,.25)}
.cp-core .ms{font-size:30px}
.cp-cta{align-self:flex-start; border-radius:var(--r-full); padding-inline:var(--sp-24) var(--sp-16); box-shadow:0 6px 16px rgba(0,20,40,.24)}

/* Floating glass tab bar */
.tabbar{position:absolute; left:var(--sp-12); right:var(--sp-12); bottom:28px; z-index:3; display:flex; padding:var(--sp-4); border-radius:var(--r-full);
  background:color-mix(in srgb,var(--c-surface) 94%,transparent); -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c-border) 80%,transparent),0 12px 32px rgba(0,30,60,.16),0 2px 6px rgba(0,30,60,.06)}
.tab{flex:1 1 0; min-width:max-content; min-height:64px; border:0; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:var(--fs-12); line-height:var(--lh-12); font-weight:500; color:var(--c-text-2); padding:var(--sp-4); border-radius:var(--r-full); position:relative; z-index:1}
.tab .pill{width:56px; height:32px; border-radius:var(--r-full); display:grid; place-items:center}
.tab[aria-current="page"]{color:var(--c-blue); font-weight:600}
.tab[aria-current="page"] .pill{background:#D6E4F0; box-shadow:inset 0 0 0 1px rgba(0,66,120,.10)}
.tab[aria-current="page"] .ms{--fill:1}
.homebar{position:absolute; bottom:var(--sp-8); left:50%; width:136px; height:4px; margin-left:-68px; border-radius:var(--r-full); background:var(--c-text); opacity:.85; z-index:12; pointer-events:none}

/* Menu: opens over a dimmed screen */
.drawer-layer{position:absolute; inset:0; z-index:10}
.drawer-layer .scrim{position:absolute; inset:0; background:rgba(0,30,56,.48)}
.drawer{position:absolute; right:0; top:var(--status-h); bottom:0; width:min(86%,336px); background:var(--c-bg); display:flex; flex-direction:column; border-radius:var(--r-24) 0 0 var(--r-24); overflow:hidden; box-shadow:-8px 0 32px rgba(0,20,40,.24)}
.drawer-head{flex:none; height:64px; display:flex; align-items:center; justify-content:space-between; gap:var(--sp-8); padding-inline:var(--sp-16) var(--sp-8); background:var(--c-blue); color:var(--c-on-blue)}
.drawer-head h2{font-size:var(--fs-20); line-height:var(--lh-20); font-weight:700}
.drawer-body{flex:1; min-height:0; overflow-y:auto; scrollbar-width:none}
.drawer-body::-webkit-scrollbar{display:none}
.drawer .res-body{gap:var(--sp-24)}

/* Onboarding and welcome */
.ob{position:absolute; inset:0; z-index:25; background:var(--c-bg); display:flex; flex-direction:column; overflow:hidden; isolation:isolate}
.ob-stage{position:absolute; left:0; right:0; top:0; height:488px; background:var(--c-blue); border-radius:0 0 var(--r-24) var(--r-24); overflow:hidden; z-index:0}
.ob-stage::before{content:""; position:absolute; inset:-30%; background:radial-gradient(36% 30% at 76% 30%,rgba(0,169,224,.34),transparent 70%),radial-gradient(30% 26% at 18% 78%,rgba(123,175,212,.2),transparent 72%)}
.ob-bar{position:relative; z-index:2; flex:none; height:56px; margin-top:var(--status-h); display:flex; align-items:center; justify-content:space-between; padding-inline:var(--sp-16) var(--sp-8); color:var(--c-on-blue)}
.ob-bar .logo{width:176px; height:auto; display:block}
.ob-skip{min-height:44px; border:0; background:transparent; color:var(--c-on-blue); font-size:var(--fs-16); font-weight:600; padding-inline:var(--sp-16); border-radius:var(--r-full)}
.ob-art{position:relative; z-index:1; flex:none; height:368px; display:grid; place-items:center}
.ob-scene{position:relative; width:296px; height:300px}
.sc{position:absolute}
.sc-pill{display:flex; align-items:center; gap:var(--sp-8); height:48px; padding-inline:var(--sp-16); border-radius:var(--r-full); background:#FFFFFF; color:var(--c-text-2); box-shadow:0 8px 24px rgba(0,10,30,.3)}
.sc-pill .ms{color:var(--c-blue)}
.sc-card{background:#FFFFFF; border-radius:var(--r-16); box-shadow:0 12px 32px rgba(0,10,30,.32); color:var(--c-text)}
.sc-line{display:block; height:10px; border-radius:var(--r-full); background:var(--c-skel)}
.sc-tag{display:inline-flex; align-items:center; gap:var(--sp-4); font-size:var(--fs-12); line-height:var(--lh-12); font-weight:600; color:#2C6E1B; background:#EAF5E6; border-radius:var(--r-full); padding:2px var(--sp-8); align-self:flex-start}
.sc-heart{width:48px; height:48px; border-radius:50%; background:#FFFFFF; display:grid; place-items:center; color:var(--c-magenta); box-shadow:0 8px 24px rgba(0,10,30,.3)}
.ob-copy{padding:var(--sp-32) var(--sp-24) 0; display:flex; flex-direction:column; align-items:center; gap:var(--sp-12); text-align:center; position:relative; z-index:1}
.ob-copy h2{font-size:var(--fs-28); line-height:var(--lh-28); font-weight:700; color:var(--c-blue); letter-spacing:-.01em; text-wrap:balance}
.ob-copy p{color:var(--c-text-2); max-width:320px}
.ob-foot{margin-top:auto; position:relative; z-index:2; padding:var(--sp-16) var(--sp-24) var(--sp-40); display:flex; flex-direction:column; gap:var(--sp-24)}
.ob-dots{display:flex; justify-content:center; gap:var(--sp-8)}
.ob-dots i{width:8px; height:8px; border-radius:var(--r-full); background:var(--c-border-strong); opacity:.45}
.ob-dots i.on{width:24px; background:var(--c-blue); opacity:1}
.ob-foot .btn{border-radius:var(--r-full)}
.ob-welcome .ob-stage{height:364px}
.ob-wel-art{position:relative; z-index:1; flex:none; height:260px; display:grid; place-items:center}
.ob-wel-icon{width:120px; height:120px; border-radius:28px; overflow:hidden; box-shadow:0 24px 48px rgba(0,10,30,.4)}
.ob-wel-icon img{width:100%; height:100%; display:block}
.ob-wel-ring{position:absolute; width:200px; height:200px; border-radius:50%; box-shadow:inset 0 0 0 1px var(--c-on-blue-line)}
.ob-wel-ring.r2{width:280px; height:280px; opacity:.6}
.ob-wel-body{position:relative; z-index:1; flex:1; display:flex; flex-direction:column; gap:var(--sp-16); padding:var(--sp-32) var(--sp-24) var(--sp-40)}
.ob-wel-body h2{font-size:var(--fs-28); line-height:var(--lh-28); font-weight:700; color:var(--c-blue); text-align:center; letter-spacing:-.01em; text-wrap:balance}
.ob-wel-body > p{color:var(--c-text-2); text-align:center}
.ob-choices{display:flex; flex-direction:column; gap:var(--sp-12); margin-top:auto}
.ob-choice{display:flex; align-items:center; gap:var(--sp-16); width:100%; min-height:72px; padding:var(--sp-12) var(--sp-16); border-radius:var(--r-16); border:0; text-align:left}
.ob-choice .rt{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--sp-4)}
.ob-choice .rt b{font-size:var(--fs-16); line-height:var(--lh-16); font-weight:700}
.ob-choice .rt span{font-size:var(--fs-14); line-height:var(--lh-14)}
.ob-choice.primary{background:var(--c-blue); color:var(--c-on-blue); box-shadow:0 8px 20px rgba(0,40,80,.24)}
.ob-choice.primary .rt span{color:var(--c-on-blue-2)}
.ob-choice.primary .ob-ic{background:var(--c-on-blue-fill); color:var(--c-on-blue)}
.ob-choice.secondary{background:var(--c-surface); color:var(--c-text); box-shadow:0 0 0 1px var(--c-border)}
.ob-choice.secondary .rt span{color:var(--c-text-2)}
.ob-choice.secondary .ob-ic{background:var(--c-tint); color:var(--c-blue)}
.ob-ic{width:44px; height:44px; border-radius:var(--r-12); display:grid; place-items:center; flex:none}
.ob-wel-link{align-self:center; min-height:44px; border:0; background:transparent; color:var(--c-blue); font-size:var(--fs-14); font-weight:600; padding-inline:var(--sp-12)}
.ob-wel-link u{text-underline-offset:3px}

/* Sheets (EULA) */
.pv-shade{position:absolute; inset:0; z-index:40; background:rgba(0,30,56,.48)}
.sheet{position:absolute; left:0; right:0; bottom:0; z-index:41; background:var(--c-surface); border-radius:var(--r-24) var(--r-24) 0 0; padding:var(--sp-12) var(--sp-24) var(--sp-32); box-shadow:0 -12px 32px rgba(0,20,40,.24); display:flex; flex-direction:column; gap:var(--sp-12)}
.sheet .grab{width:40px; height:4px; border-radius:var(--r-full); background:var(--c-border); margin:0 auto var(--sp-4)}
.sheet h2{font-size:var(--fs-24); line-height:var(--lh-24); color:var(--c-blue); font-weight:700}
.sheet .meta{font-size:var(--fs-14); color:var(--c-text-2)}
.sheet .btn{width:100%; border-radius:var(--r-full); margin-top:var(--sp-12)}

/* Lock screen (push notifications) */
.lock{position:absolute; inset:0; background:radial-gradient(120% 80% at 80% 0%,#336893 0,#004278 55%,#0D1620 100%); color:#FFFFFF; display:flex; flex-direction:column; align-items:center; padding:96px var(--sp-16) 0}
.lock-time{font-size:72px; font-weight:300; line-height:1; letter-spacing:-.02em}
.lock-date{color:var(--c-on-blue-2); margin-top:var(--sp-8)}
.push{width:100%; margin-top:var(--sp-40); background:rgba(255,255,255,.92); color:#1F2A33; border-radius:var(--r-16); padding:var(--sp-12); display:grid; gap:var(--sp-4); box-shadow:0 8px 24px rgba(0,0,0,.25)}
.push-top{display:flex; align-items:center; gap:var(--sp-8); font-size:var(--fs-12); color:#4A5560; text-transform:uppercase; letter-spacing:.04em; font-weight:600}
.push-top img{width:20px; height:20px; border-radius:5px}
.push-top .when{margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400}
.push-t{font-weight:700; line-height:1.3}
.push-b{font-size:var(--fs-14); line-height:1.4}
.push-img{border-radius:var(--r-12); overflow:hidden; height:120px; margin-top:var(--sp-8)}
.push-img svg{width:100%; height:100%; display:block}
.push-note{margin-top:auto; margin-bottom:var(--sp-32); font-size:var(--fs-12); color:var(--c-on-blue-2); text-align:center}

/* Locations (location-aware configuration) */
.loc-card{overflow:hidden}
.loc-map{height:140px; background:#E6EDF3; position:relative}
.loc-map i{position:absolute; left:50%; top:50%; width:20px; height:20px; border-radius:50%; background:var(--c-blue); box-shadow:0 0 0 6px rgba(0,66,120,.2); transform:translate(-50%,-50%)}
.loc-body{padding:var(--sp-16); display:grid; gap:var(--sp-8)}
.loc-body h2{font-size:var(--fs-20); line-height:var(--lh-20); color:var(--c-blue)}
.loc-tip{display:flex; gap:var(--sp-8); align-items:flex-start; padding:var(--sp-12); border-radius:var(--r-12); background:var(--c-tint); font-size:var(--fs-14); line-height:var(--lh-14)}
.loc-tip .ms,.loc-row .ms{color:var(--c-blue)}
.loc-row{display:flex; gap:var(--sp-8); align-items:center; font-size:var(--fs-14); color:var(--c-text-2)}
.loc-body .btn{border-radius:var(--r-full); margin-top:var(--sp-8)}
